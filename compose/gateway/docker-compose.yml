services:
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      JELLYFIN_DOMAIN: ${JELLYFIN_DOMAIN:-jellyfin.${DOMAIN:-example.com}}
      JELLYSEERR_DOMAIN: ${JELLYSEERR_DOMAIN:-jellyseerr.${DOMAIN:-example.com}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      - ./html:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - moody-blues-net

networks:
  moody-blues-net:
    external: true

volumes:
  caddy_data:
  caddy_config:
