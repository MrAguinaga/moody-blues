services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_DOMAIN:-jellyfin.${DOMAIN:-example.com}}
    volumes:
      - ${MEDIA_MOUNT_PATH:-/mnt/media}:/media:ro
      - jellyfin_config:/config
      - jellyfin_cache:/cache
    networks:
      - moody-blues-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      PORT: 5055
    volumes:
      - jellyseerr_config:/app/config
    networks:
      - moody-blues-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  moody-blues-net:
    external: true

volumes:
  jellyfin_config:
  jellyfin_cache:
  jellyseerr_config:
