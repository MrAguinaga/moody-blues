services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - prowlarr_config:/config
    networks:
      - moody-blues-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - sonarr_config:/config
      # Raw Zurg FUSE mount – read-only. Symlinks in /data/downloads resolve here.
      - ${ZURG_MOUNT_PATH:-/mnt/zurg}:/mnt/zurg:ro
      # Organized media library – writable. Sonarr imports/renames files into here.
      - ${MEDIA_PATH:-/mnt/media}:/media
      # RDT-Client symlink directory (read-only; symlinks point into /mnt/zurg)
      - ./rdtclient_symlinks:/data/downloads:ro
    networks:
      - moody-blues-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - radarr_config:/config
      # Raw Zurg FUSE mount – read-only. Symlinks in /data/downloads resolve here.
      - ${ZURG_MOUNT_PATH:-/mnt/zurg}:/mnt/zurg:ro
      # Organized media library – writable. Radarr imports/renames files into here.
      - ${MEDIA_PATH:-/mnt/media}:/media
      # RDT-Client symlink directory (read-only; symlinks point into /mnt/zurg)
      - ./rdtclient_symlinks:/data/downloads:ro
    networks:
      - moody-blues-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    ports:
      - "127.0.0.1:6500:6500"
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - rdtclient_data:/data/db
      # Raw Zurg FUSE mount – RDT-Client creates symlinks pointing to files here.
      - ${ZURG_MOUNT_PATH:-/mnt/zurg}:/mnt/zurg:ro
      # Symlink output directory (shared with Sonarr/Radarr as /data/downloads)
      - ./rdtclient_symlinks:/data/downloads
    networks:
      - moody-blues-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6500 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Etc/UTC}
    networks:
      - moody-blues-net

networks:
  moody-blues-net:
    external: true

volumes:
  prowlarr_config:
  sonarr_config:
  radarr_config:
  rdtclient_data:
