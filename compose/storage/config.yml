zurg: v1
token: ${RD_API_TOKEN}
port: 9999
check_for_changes_every_secs: 15
api_rate_limit_per_minute: 60
torrents_rate_limit_per_minute: 25
concurrent_workers: 32
enable_repair: true
ignore_renames: true
retain_rd_torrent_name: true
retain_folder_name_extension: true

directories:
  anime:
    group_order: 10
    group: media
    filters:
      - regex: /\b[a-fA-F0-9]{8}\b|anime/i
      - any_file_inside_regex: /\b[a-fA-F0-9]{8}\b/
  shows:
    group_order: 20
    group: media
    filters:
      - has_episodes: true
      - regex: /shows|series|season/i
  movies:
    group_order: 30
    group: media
    only_show_the_biggest_file: true
    filters:
      - regex: /movies|movie|pelis|pelicula/i
  torrents:
    group_order: 40
    group: media
    filters:
      - regex: /.*/
