name: Continuous Deployment

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pre-flight:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose syntax
        run: |
          DOMAIN="example.com" docker compose -f compose/gateway/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f compose/storage/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f compose/stream/docker-compose.yml config --quiet
          docker compose --env-file .env.example -f compose/automation/docker-compose.yml config --quiet

  deploy:
    name: Remote SSH Deployment
    needs: pre-flight
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            TARGET_DIR="/opt/moody-blues"
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "==> Deploying branch: ${TARGET_BRANCH} to ${TARGET_DIR}"

            if [ ! -d "${TARGET_DIR}/.git" ]; then
              echo "==> Repository not found. Initializing clone..."
              git clone -b "${TARGET_BRANCH}" https://github.com/MrAguinaga/moody-blues.git "${TARGET_DIR}"
            fi

            cd "${TARGET_DIR}"

            echo "==> Syncing latest changes from branch ${TARGET_BRANCH}..."
            git fetch origin "${TARGET_BRANCH}"
            git checkout "${TARGET_BRANCH}"
            git reset --hard "origin/${TARGET_BRANCH}"

            if [ ! -f .env ]; then
              echo "WARNING: ${TARGET_DIR}/.env not found, creating from .env.example"
              cp .env.example .env
            fi

            echo "==> Ensuring storage defaults exist in .env..."
            for var in RD_API_TOKEN ZURG_MOUNT_PATH MEDIA_PATH PUID PGID; do
              if ! grep -q "^${var}=" .env; then
                echo "==> Appending default ${var} from .env.example to .env..."
                grep "^${var}=" .env.example >> .env || true
              fi
            done

            if ! grep -q "JELLYFIN_DOMAIN" .env; then
              echo "==> Appending JELLYFIN_DOMAIN configuration from .env.example to .env..."
              grep "JELLYFIN_DOMAIN" .env.example >> .env || true
            fi

            if ! grep -q "JELLYSEERR_DOMAIN" .env; then
              echo "==> Appending JELLYSEERR_DOMAIN configuration from .env.example to .env..."
              grep "JELLYSEERR_DOMAIN" .env.example >> .env || true
            fi

            for var in SONARR_DOMAIN RADARR_DOMAIN PROWLARR_DOMAIN; do
              if ! grep -q "^${var}=" .env; then
                echo "==> Appending ${var} configuration from .env.example to .env..."
                grep "^${var}=" .env.example >> .env || true
              fi
            done

            ZURG_MOUNT_PATH=$(grep -E '^ZURG_MOUNT_PATH=' .env | head -n 1 | cut -d '=' -f2- | tr -d ' "' || true)
            MEDIA_PATH=$(grep -E '^MEDIA_PATH=' .env | head -n 1 | cut -d '=' -f2- | tr -d ' "' || true)
            ZURG_MOUNT_PATH="${ZURG_MOUNT_PATH:-/mnt/zurg}"
            MEDIA_PATH="${MEDIA_PATH:-/mnt/media}"

            echo "==> Ensuring Zurg raw mount directory exists: ${ZURG_MOUNT_PATH}..."
            mkdir -p "${ZURG_MOUNT_PATH}" 2>/dev/null || sudo -n mkdir -p "${ZURG_MOUNT_PATH}" 2>/dev/null || true

            echo "==> Ensuring organized media library directories exist: ${MEDIA_PATH}/{anime,movies,shows}..."
            mkdir -p "${MEDIA_PATH}/anime" "${MEDIA_PATH}/movies" "${MEDIA_PATH}/shows" 2>/dev/null \\
              || sudo -n mkdir -p "${MEDIA_PATH}/anime" "${MEDIA_PATH}/movies" "${MEDIA_PATH}/shows" 2>/dev/null || true

            echo "==> Ensuring external network moody-blues-net exists..."
            docker network inspect moody-blues-net >/dev/null 2>&1 || docker network create moody-blues-net

            echo "==> Orchestrating gateway stack..."
            docker compose --env-file .env -f compose/gateway/docker-compose.yml up -d --remove-orphans

            RD_TOKEN=$(grep -E '^RD_API_TOKEN=' .env | head -n 1 | cut -d '=' -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" || true)
            if [ -n "$RD_TOKEN" ] && [ "$RD_TOKEN" != "your-real-debrid-api-token" ]; then
              echo "==> Injecting RD_API_TOKEN into compose/storage/config.yml..."
              sed -i "s|\${RD_API_TOKEN}|${RD_TOKEN}|g" compose/storage/config.yml
            fi

            echo "==> Orchestrating storage stack..."
            docker compose --env-file .env -f compose/storage/docker-compose.yml up -d --remove-orphans

            echo "==> Orchestrating stream stack..."
            docker compose --env-file .env -f compose/stream/docker-compose.yml up -d --remove-orphans

            echo "==> Orchestrating automation stack..."
            docker compose --env-file .env -f compose/automation/docker-compose.yml up -d --remove-orphans

            echo "==> Reloading Caddy ingress configuration..."
            docker compose --env-file .env -f compose/gateway/docker-compose.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || docker compose --env-file .env -f compose/gateway/docker-compose.yml restart caddy

            echo "==> Verifying container status..."
            sleep 3
            docker compose --env-file .env -f compose/gateway/docker-compose.yml ps
            docker compose --env-file .env -f compose/storage/docker-compose.yml ps
            docker compose --env-file .env -f compose/stream/docker-compose.yml ps
            docker compose --env-file .env -f compose/automation/docker-compose.yml ps

            CADDY_STATUS=$(docker inspect --format='{{.State.Status}}' caddy 2>/dev/null || echo "missing")
            if [ "$CADDY_STATUS" != "running" ]; then
              echo "ERROR: Caddy container is not running (status: $CADDY_STATUS)"
              docker logs --tail 50 caddy 2>&1 || true
              exit 1
            fi
            echo "==> Gateway verified: Caddy is running."

            RD_TOKEN=$(grep -E '^RD_API_TOKEN=' .env | head -n 1 | cut -d '=' -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//" || true)
            if [ -n "$RD_TOKEN" ] && [ "$RD_TOKEN" != "your-real-debrid-api-token" ]; then
              echo "==> RD_API_TOKEN is configured. Waiting for zurg and rclone to reach running state..."
              TIMEOUT=60
              while [ $TIMEOUT -gt 0 ]; do
                ZURG_STATUS=$(docker inspect --format='{{.State.Status}}' zurg 2>/dev/null || echo "missing")
                RCLONE_STATUS=$(docker inspect --format='{{.State.Status}}' rclone 2>/dev/null || echo "missing")
                if [ "$ZURG_STATUS" = "running" ] && [ "$RCLONE_STATUS" = "running" ]; then
                  break
                fi
                sleep 2
                TIMEOUT=$((TIMEOUT - 2))
              done

              ZURG_STATUS=$(docker inspect --format='{{.State.Status}}' zurg 2>/dev/null || echo "missing")
              if [ "$ZURG_STATUS" != "running" ]; then
                echo "ERROR: Zurg container is not running (status: $ZURG_STATUS)"
                docker logs --tail 50 zurg 2>&1 || true
                exit 1
              fi

              RCLONE_STATUS=$(docker inspect --format='{{.State.Status}}' rclone 2>/dev/null || echo "missing")
              if [ "$RCLONE_STATUS" != "running" ]; then
                echo "ERROR: Rclone container is not running (status: $RCLONE_STATUS)"
                docker logs --tail 50 rclone 2>&1 || true
                exit 1
              fi
              echo "==> Storage verified: Zurg and Rclone are running."
            else
              echo "==> RD_API_TOKEN is unconfigured or set to placeholder; skipping strict running check for zurg and rclone."
            fi

            JELLYFIN_STATUS=$(docker inspect --format='{{.State.Status}}' jellyfin 2>/dev/null || echo "missing")
            if [ "$JELLYFIN_STATUS" != "running" ]; then
              echo "ERROR: Jellyfin container is not running (status: $JELLYFIN_STATUS)"
              docker logs --tail 50 jellyfin 2>&1 || true
              exit 1
            fi

            JELLYSEERR_STATUS=$(docker inspect --format='{{.State.Status}}' jellyseerr 2>/dev/null || echo "missing")
            if [ "$JELLYSEERR_STATUS" != "running" ]; then
              echo "ERROR: Jellyseerr container is not running (status: $JELLYSEERR_STATUS)"
              docker logs --tail 50 jellyseerr 2>&1 || true
              exit 1
            fi
            echo "==> Stream verified: Jellyfin and Jellyseerr are running."

            for service in sonarr radarr prowlarr rdtclient; do
              SERVICE_STATUS=$(docker inspect --format='{{.State.Status}}' "$service" 2>/dev/null || echo "missing")
              if [ "$SERVICE_STATUS" != "running" ]; then
                echo "ERROR: Container $service is not running (status: $SERVICE_STATUS)"
                docker logs --tail 50 "$service" 2>&1 || true
                exit 1
              fi
            done
            echo "==> Automation verified: Sonarr, Radarr, Prowlarr, and RDTClient are running."

            echo "==> Deployment successfully verified."
